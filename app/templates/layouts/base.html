
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
		<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker@3.1.0/daterangepicker.css" />
		<link href="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css" rel="stylesheet" />
		<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
		<title>{% block title %}{% endblock %}</title>
	</head>
	<body class="d-flex flex-column" style="background: linear-gradient(to right, #f3564c, #f3a94c); color: #fff;">
		<header class="flex-grow-0">
			<nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom shadow mb-4" style="background-color:#212529;">
				<div class="container">
					<a class="navbar-brand fs-2 text-brand fw-bold" href="/">ChihuaEvents</a>
					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#navbarSupportedContent"
						aria-controls="navbarSupportedContent"
						aria-expanded="false"
						aria-label="Toggle navigation"
					>
						<span class="navbar-toggler-icon"></span>
					</button>
					<div class="collapse navbar-collapse" id="navbarSupportedContent">
						<ul class="navbar-nav me-auto mb-2 mb-lg-0">
							<li class="nav-item">
								<a class="nav-link fw-semibold" href="/events">Eventos</a>
							</li>
							<li class="nav-item">
								<a class="nav-link fw-semibold" href="#">Sponsors</a>
							</li>
							<!-- <li class="nav-item">
								<a class="nav-link fw-semibold" href="#">Contact</a>
							</li> -->
						</ul>
						<!-- <form class="d-flex" role="search">
							<input class="form-control me-2" type="search" placeholder="Search events" aria-label="Search" />
							<button class="btn btn-custom" type="submit">Search</button>
						</form> -->
					</div>
				</div>
			</nav>
		</header>
		<main class="p-5 d-flex flex-column align-items-center flex-grow-1">{% block body %}{% endblock %}</main>
		<footer class="text-white p-4 mt-5 flex-grow-0" style="background-color:#212529;">
			<div class="container">
				<div class="row g-4">
					<div class="col-md-4">
						<h3 class="h5 fw-bold mb-3">ChihuaEvents</h3>
						<p>Los mejores eventos de Chihuahua</p>
					</div>
					<div class="col-md-4">
						<h3 class="h5 fw-bold mb-3">Links</h3>
						<ul class="list-unstyled">
							<li class="mb-2"><a href="/" class="text-white text-decoration-none">Inicio</a></li>
							<li class="mb-2"><a href="/events" class="text-white text-decoration-none">Eventos</a></li>
							<li class="mb-2"><a href="#" class="text-white text-decoration-none">Sponsors</a></li>
						</ul>
					</div>
					<div class="col-md-4">
						<h3 class="h5 fw-bold mb-3">Contactos</h3>
						<p><i class="fas fa-map-marker-alt me-2"></i> Chihuahua, Chihuahua, Mexico</p>
						<p><i class="fas fa-envelope me-2"></i> chihua@gmail.com</p>
						<p><i class="fas fa-phone me-2"></i> (614) 432-4567</p>
						<div class="d-flex gap-3 mt-3">
							<a href="#" class="text-white fs-5 social-icon"><i class="fab fa-facebook"></i></a>
							<a href="#" class="text-white fs-5 social-icon"><i class="fab fa-instagram"></i></a>
							<a href="#" class="text-white fs-5 social-icon"><i class="fab fa-twitter"></i></a>
							<a href="#" class="text-white fs-5 social-icon"><i class="fab fa-youtube"></i></a>
						</div>
					</div>
				</div>
				<hr class="my-4" />
				<div class="text-center">
					<p class="mb-0">&copy; ChihuaEvents.</p>
				</div>
			</div>
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker@3.1.0/daterangepicker.min.js"></script>
		<script src="{{ url_for('static', filename='js/date_range.js') }}"></script>
		<script src="{{ url_for('static', filename='js/filter_events.js') }}"></script>
		<script src="{{ url_for('static', filename='js/mapbox.js') }}" defer></script>
		<script src="{{ url_for('static', filename='js/mapbox-gl.js') }}" defer></script>
		<script src="{{ url_for('static', filename='js/mapkick.js') }}" defer></script>
	</body>
</html>
